<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
html,
body,
#root {
  margin: 0;
  height: 100%;
  min-height: 100%;
  background: #020617;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}
body {
  overflow: hidden;
}
.nav-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 6px;
  z-index: 9998;
  padding: 0 18px 12px;
  box-sizing: border-box;
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
.nav-tab {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.6);
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.2;
  letter-spacing: 0.01em;
  backdrop-filter: blur(10px);
  cursor: pointer;
  user-select: none;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.nav-tab:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.22);
  color: rgba(255, 255, 255, 0.85);
}
.nav-tab.active {
  color: white;
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
}
.nav-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, rgba(56, 189, 248, 0.2), rgba(34, 197, 94, 0.2));
  pointer-events: none;
}
.nav-label {
  position: relative;
  z-index: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.progress-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 6px;
  background: rgba(255, 255, 255, 0.08);
  z-index: 9999;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #22c55e);
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import SlideOne   from "./slide_1_executive_overview.js";
import SlideTwo   from "./slide_2_sales_team_performance.js";
import SlideThree from "./slide_3_pipeline_overview.js";
import SlideFour  from "./slide_4_team_activity_dashboard.js";
import SlideFive  from "./slide_5_monthly_team_performance.js";
import SlideSix   from "./slide_6_financial_dashboard.js";

const SLIDE_DURATION = 60000;
const TICK_MS = 100;

const slides = [
  { component: SlideOne,   label: "Executive Overview" },
  { component: SlideTwo,   label: "Sales Team Performance" },
  { component: SlideThree, label: "Pipeline Overview" },
  { component: SlideFour,  label: "Team Activity Dashboard" },
  { component: SlideFive,  label: "Monthly Team Performance" },
  { component: SlideSix,   label: "Financial Dashboard" },
];

function App() {
  const [index,   setIndex]   = React.useState(0);
  const [elapsed, setElapsed] = React.useState(0);

  React.useEffect(() => {
    const timer = setInterval(() => {
      setElapsed((prev) => {
        const next = prev + TICK_MS;
        if (next >= SLIDE_DURATION) {
          setIndex((i) => (i + 1) % slides.length);
          return 0;
        }
        return next;
      });
    }, TICK_MS);
    return () => clearInterval(timer);
  }, []);

  function goToSlide(i) {
    setIndex(i);
    setElapsed(0);
  }

  const CurrentSlide = slides[index].component;
  const progress = Math.min(elapsed / SLIDE_DURATION, 1);

  return React.createElement(
    React.Fragment,
    null,
    React.createElement(CurrentSlide),
    React.createElement(
      "div",
      { className: "nav-wrap" },
      React.createElement(
        "div",
        { className: "nav-grid" },
        slides.map((slide, i) => {
          const isActive = i === index;
          const tabProgress = isActive ? progress : i < index ? 1 : 0;
          return React.createElement(
            "div",
            {
              key: slide.label,
              className: `nav-tab${isActive ? " active" : ""}`,
              onClick: () => goToSlide(i),
            },
            React.createElement("div", {
              className: "nav-fill",
              style: { width: `${tabProgress * 100}%` },
            }),
            React.createElement("div", { className: "nav-label" }, slide.label)
          );
        })
      )
    ),
    React.createElement(
      "div",
      { className: "progress-wrap" },
      React.createElement("div", {
        className: "progress-bar",
        style: { width: `${progress * 100}%` },
      })
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
